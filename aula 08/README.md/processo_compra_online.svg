<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><marker id="msg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3" fill="none" stroke="#555"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#222;font-size:13px}.pool{fill:#fff;stroke:#333;stroke-width:1.5}.lane{fill:#fff;stroke:#888}.task{fill:#fff;stroke:#333;stroke-width:1.5}.event{fill:#fff;stroke:#333;stroke-width:2}.gateway{fill:#fff;stroke:#333;stroke-width:1.5}.seq{fill:none;stroke:#333;stroke-width:1.5;marker-end:url(#arrow)}.msg{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#msg)}.label{font-size:12px;text-anchor:middle}.small{font-size:11px}</style>
